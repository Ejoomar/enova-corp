<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- ENOVA brand blue background -->
  <rect width="100" height="100" rx="22" fill="#009EF5"/>

  <!-- Two interlocked loops — approximación del logo ENOVA CORP -->
  <!-- Loop izquierdo, inclinado -10° -->
  <ellipse
    cx="38" cy="53"
    rx="20" ry="26"
    stroke="white" stroke-width="6.5" fill="none"
    transform="rotate(-10 38 53)"
  />
  <!-- Loop derecho, inclinado +10° -->
  <ellipse
    cx="62" cy="53"
    rx="20" ry="26"
    stroke="white" stroke-width="6.5" fill="none"
    transform="rotate(10 62 53)"
  />
</svg>
