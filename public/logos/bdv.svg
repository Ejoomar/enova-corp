<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 105">
  <!-- Mark: Venezuelan flag colors (yellow, blue, red) forming a chevron -->
  <!-- Yellow left parallelogram -->
  <polygon points="0,8 33,8 56,96 0,60" fill="#FFD100"/>
  <!-- Blue center trapezoid -->
  <polygon points="28,8 66,8 66,96 46,96" fill="#005CA8"/>
  <!-- Red upper-right triangle -->
  <polygon points="54,8 98,8 80,55" fill="#CF122D"/>
  <!-- "Banco de" regular weight -->
  <text x="115" y="44" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#111111">Banco de</text>
  <!-- "Venezuela" bold -->
  <text x="115" y="76" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="900" fill="#111111">Venezuela</text>
</svg>
