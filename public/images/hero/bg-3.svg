  <!-- Camera lens (right side) -->
  <g filter="url(#glow3f)">
    <circle cx="1050" cy="210" r="120" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
    <circle cx="1050" cy="210" r="90" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.35"/>
    <circle cx="1050" cy="210" r="60" fill="url(#lensGlow)" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
    <circle cx="1050" cy="210" r="35" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
    <circle cx="1050" cy="210" r="15" fill="#1d4ed8" opacity="0.4"/>
    <circle cx="1050" cy="210" r="6" fill="#60a5fa" opacity="0.8"/>
    <!-- Lens reflections -->
    <circle cx="1035" cy="195" r="4" fill="white" opacity="0.15"/>
    <circle cx="1040" cy="192" r="2" fill="white" opacity="0.2"/>
    <!-- Crosshairs -->
    <line x1="1050" y1="85" x2="1050" y2="330" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
    <line x1="925" y1="210" x2="1175" y2="210" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Scanning lines -->
  <g opacity="0.5">
    <rect x="0" y="180" width="1440" height="1" fill="url(#bar3)"/>
    <rect x="0" y="240" width="1440" height="0.5" fill="url(#bar3)" opacity="0.4"/>
  </g>

  <!-- Top accent -->
  <rect x="0" y="0" width="1440" height="2" fill="url(#bar3)" opacity="0.7"/>

  <!-- Highlighted hexagons (security alert) -->
  <polygon points="600,138 630,120 660,138 660,174 630,192 600,174" fill="#1d4ed8" opacity="0.2"/>
  <polygon points="840,84 870,66 900,84 900,120 870,138 840,120" fill="#1d4ed8" opacity="0.15"/>

  <text x="30" y="380" font-family="monospace" font-size="90" fill="#0a1f5c" opacity="0.15" font-weight="bold" letter-spacing="10">SECURITY</text>
</svg>
