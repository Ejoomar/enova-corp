    <polygon points="165,192 195,174 225,192 225,228 195,246 165,228"/>
    <polygon points="255,192 285,174 315,192 315,228 285,246 255,228"/>
    <polygon points="345,192 375,174 405,192 405,228 375,246 345,228"/>
