<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1445"/>
      <stop offset="50%" style="stop-color:#0f1f5c"/>
      <stop offset="100%" style="stop-color:#0a2a6e"/>
    </linearGradient>
    <radialGradient id="glow3" cx="70%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#0c1445;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="60%" style="stop-color:#1d4ed8;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow3f">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#bg3)"/>
  <rect width="1440" height="420" fill="url(#glow3)"/>

