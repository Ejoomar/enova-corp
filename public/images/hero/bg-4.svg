<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808"/>
      <stop offset="50%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1c1c2e"/>
    </linearGradient>
    <radialGradient id="glow4" cx="60%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#080808;stop-opacity:0"/>
    </radialGradient>
    <filter id="nf">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nfs">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#bg4)"/>
  <rect width="1440" height="420" fill="url(#glow4)"/>

  <!-- Network connection lines -->
  <g stroke="#3730a3" stroke-width="1" opacity="0.5">
    <!-- Hub at center-right -->
    <line x1="1050" y1="210" x2="850" y2="100"/>
    <line x1="1050" y1="210" x2="900" y2="320"/>
    <line x1="1050" y1="210" x2="750" y2="210"/>
    <line x1="1050" y1="210" x2="1200" y2="100"/>
    <line x1="1050" y1="210" x2="1250" y2="300"/>
    <line x1="1050" y1="210" x2="1150" y2="350"/>
    <line x1="1050" y1="210" x2="1300" y2="200"/>
    <!-- Secondary connections -->
    <line x1="850" y1="100" x2="700" y2="60"/>
    <line x1="850" y1="100" x2="750" y2="210"/>
    <line x1="750" y1="210" x2="600" y2="150"/>
    <line x1="750" y1="210" x2="600" y2="300"/>
    <line x1="600" y1="150" x2="450" y2="100"/>
    <line x1="600" y1="150" x2="500" y2="250"/>
    <line x1="600" y1="300" x2="450" y2="350"/>
    <line x1="600" y1="300" x2="500" y2="250"/>
    <line x1="450" y1="100" x2="300" y2="80"/>
    <line x1="450" y1="100" x2="350" y2="200"/>
    <line x1="450" y1="350" x2="300" y2="340"/>
    <line x1="450" y1="350" x2="350" y2="260"/>
    <line x1="300" y1="80" x2="200" y2="150"/>
    <line x1="300" y1="340" x2="200" y2="280"/>
    <line x1="200" y1="150" x2="100" y2="120"/>
    <line x1="200" y1="280" x2="100" y2="320"/>
    <line x1="1200" y1="100" x2="1300" y2="60"/>
    <line x1="1200" y1="100" x2="1380" y2="150"/>
    <line x1="1250" y1="300" x2="1380" y2="350"/>
    <line x1="900" y1="320" x2="1050" y2="380"/>
    <line x1="1150" y1="350" x2="1050" y2="380"/>
    <!-- Tertiary -->
    <line x1="350" y1="200" x2="500" y2="250"/>
    <line x1="350" y1="260" x2="500" y2="250"/>
  </g>

  <!-- Data packets (moving dots effect) -->
  <g fill="#8b5cf6" opacity="0.7">
    <!-- On line 1050->850,100 -->
    <circle cx="980" cy="165" r="2.5"/>
    <!-- On line 1050->750 -->
    <circle cx="920" cy="210" r="2.5"/>
    <!-- On line 750->600,150 -->
    <circle cx="675" cy="180" r="2"/>
    <!-- On line 600->450,100 -->
    <circle cx="525" cy="125" r="2"/>
    <!-- On line 450->300,80 -->
    <circle cx="375" cy="90" r="2"/>
  </g>

  <!-- Main network nodes -->
  <g filter="url(#nf)">
    <!-- Primary hub -->
    <circle cx="1050" cy="210" r="14" fill="#4c1d95" opacity="0.8"/>
    <circle cx="1050" cy="210" r="8" fill="#7c3aed" opacity="0.9"/>
    <circle cx="1050" cy="210" r="4" fill="#a78bfa" opacity="1"/>

    <!-- Secondary nodes -->
    <circle cx="850" cy="100" r="8" fill="#5b21b6" opacity="0.8"/>
    <circle cx="850" cy="100" r="4" fill="#8b5cf6" opacity="1"/>
    <circle cx="750" cy="210" r="8" fill="#5b21b6" opacity="0.8"/>
    <circle cx="750" cy="210" r="4" fill="#8b5cf6" opacity="1"/>
    <circle cx="900" cy="320" r="8" fill="#5b21b6" opacity="0.8"/>
    <circle cx="900" cy="320" r="4" fill="#8b5cf6" opacity="1"/>
    <circle cx="1200" cy="100" r="8" fill="#5b21b6" opacity="0.8"/>
    <circle cx="1200" cy="100" r="4" fill="#8b5cf6" opacity="1"/>
    <circle cx="1250" cy="300" r="8" fill="#5b21b6" opacity="0.8"/>
    <circle cx="1250" cy="300" r="4" fill="#8b5cf6" opacity="1"/>

    <!-- Tertiary nodes -->
    <circle cx="600" cy="150" r="5" fill="#6d28d9" opacity="0.9"/>
    <circle cx="600" cy="300" r="5" fill="#6d28d9" opacity="0.9"/>
    <circle cx="450" cy="100" r="5" fill="#6d28d9" opacity="0.9"/>
    <circle cx="450" cy="350" r="5" fill="#6d28d9" opacity="0.9"/>
    <circle cx="300" cy="80" r="4" fill="#4c1d95" opacity="0.8"/>
    <circle cx="300" cy="340" r="4" fill="#4c1d95" opacity="0.8"/>
    <circle cx="200" cy="150" r="4" fill="#4c1d95" opacity="0.8"/>
    <circle cx="200" cy="280" r="4" fill="#4c1d95" opacity="0.8"/>
    <circle cx="500" cy="250" r="5" fill="#6d28d9" opacity="0.9"/>
    <circle cx="350" cy="200" r="4" fill="#4c1d95" opacity="0.8"/>
    <circle cx="350" cy="260" r="4" fill="#4c1d95" opacity="0.8"/>
  </g>

  <!-- Outer ring on main hub -->
  <circle cx="1050" cy="210" r="20" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  <circle cx="1050" cy="210" r="26" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.25"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1440" height="2" fill="url(#bar4)" opacity="0.8"/>

  <!-- Signal waves from hub -->
  <circle cx="1050" cy="210" r="45" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.2"/>
  <circle cx="1050" cy="210" r="70" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.12"/>
  <circle cx="1050" cy="210" r="100" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.07"/>

  <text x="30" y="380" font-family="monospace" font-size="90" fill="#12082e" opacity="0.2" font-weight="bold" letter-spacing="10">NETWORK</text>
</svg>
