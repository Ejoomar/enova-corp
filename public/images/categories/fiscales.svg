<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#020d08"/><stop offset="100%" stop-color="#041c10"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g fill="#22c55e" opacity="0.1">
    <circle cx="50" cy="50" r="1.5"/><circle cx="100" cy="50" r="1.5"/><circle cx="650" cy="50" r="1.5"/><circle cx="750" cy="50" r="1.5"/>
    <circle cx="50" cy="450" r="1.5"/><circle cx="750" cy="450" r="1.5"/>
  </g>

  <!-- ── Receipt tape (background) ── -->
  <rect x="370" y="80" width="90" height="220" rx="3" fill="#030e07" stroke="#14532d" stroke-width="1.2" opacity="0.8"/>
  <g stroke="#16a34a" stroke-width="1" opacity="0.3">
    <line x1="382" y1="100" x2="448" y2="100"/><line x1="382" y1="112" x2="430" y2="112"/>
    <line x1="382" y1="124" x2="448" y2="124"/><line x1="382" y1="136" x2="420" y2="136"/>
    <line x1="382" y1="148" x2="448" y2="148"/><line x1="382" y1="160" x2="410" y2="160"/>
    <line x1="382" y1="172" x2="448" y2="172"/><line x1="382" y1="184" x2="438" y2="184"/>
    <line x1="382" y1="196" x2="448" y2="196"/><line x1="382" y1="208" x2="415" y2="208"/>
    <line x1="382" y1="220" x2="448" y2="220"/><line x1="382" y1="232" x2="440" y2="232"/>
    <line x1="382" y1="244" x2="448" y2="244"/><line x1="382" y1="256" x2="425" y2="256"/>
  </g>
  <!-- Receipt zigzag cut -->
  <path d="M370 296 l10-8 l10 8 l10-8 l10 8 l10-8 l10 8 l10-8 l10 8 l10-8 l10 8" stroke="#14532d" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- ── POS Terminal body ── -->
  <rect x="215" y="220" width="260" height="210" rx="14" fill="#030e07" stroke="#15803d" stroke-width="2.2"/>
  <rect x="215" y="220" width="260" height="4" rx="2" fill="#22c55e" opacity="0.6"/>

  <!-- Screen display -->
  <rect x="233" y="236" width="224" height="110" rx="6" fill="#020b05"/>
  <rect x="233" y="236" width="224" height="110" rx="6" fill="#22c55e" opacity="0.08"/>
  <rect x="233" y="236" width="224" height="3" rx="1.5" fill="#22c55e" opacity="0.5"/>
  <!-- Screen content -->
  <rect x="248" y="254" width="100" height="5" rx="2.5" fill="#22c55e" opacity="0.7"/>
  <rect x="248" y="268" width="80" height="3" rx="1.5" fill="#4ade80" opacity="0.4"/>
  <rect x="248" y="280" width="140" height="3" rx="1.5" fill="#4ade80" opacity="0.3"/>
  <rect x="248" y="292" width="60" height="3" rx="1.5" fill="#4ade80" opacity="0.35"/>
  <rect x="340" y="292" width="80" height="3" rx="1.5" fill="#22c55e" opacity="0.5"/>
  <!-- Total amount display -->
  <rect x="248" y="310" width="140" height="22" rx="4" fill="#052210" stroke="#15803d" stroke-width="1"/>
  <rect x="258" y="316" width="90" height="10" rx="3" fill="#22c55e" opacity="0.7"/>

  <!-- Keypad -->
  <g fill="#021108" stroke="#15803d" stroke-width="0.8">
    <!-- Row 1: 1 2 3 -->
    <rect x="236" y="360" width="40" height="22" rx="4"/><rect x="282" y="360" width="40" height="22" rx="4"/><rect x="328" y="360" width="40" height="22" rx="4"/>
    <!-- Row 2: 4 5 6 -->
    <rect x="236" y="386" width="40" height="22" rx="4"/><rect x="282" y="386" width="40" height="22" rx="4"/><rect x="328" y="386" width="40" height="22" rx="4"/>
    <!-- Row 3: 7 8 9 -->
    <rect x="236" y="412" width="40" height="22" rx="4"/><rect x="282" y="412" width="40" height="22" rx="4"/><rect x="328" y="412" width="40" height="22" rx="4"/>
  </g>
  <!-- Enter/Cancel keys -->
  <rect x="374" y="360" width="40" height="74" rx="4" fill="#052210" stroke="#22c55e" stroke-width="1.2"/>
  <rect x="374" y="360" width="40" height="74" rx="4" fill="#22c55e" opacity="0.12"/>
  <!-- 0 key -->
  <rect x="236" y="438" width="40" height="22" rx="4" fill="#021108" stroke="#15803d" stroke-width="0.8"/>
  <rect x="282" y="438" width="86" height="22" rx="4" fill="#021108" stroke="#15803d" stroke-width="0.8"/>

  <!-- Card slot -->
  <rect x="233" y="356" width="100" height="4" rx="2" fill="#15803d" opacity="0.4"/>
  <!-- Paper slot at top -->
  <rect x="340" y="222" width="80" height="6" rx="3" fill="#021108" stroke="#15803d" stroke-width="1"/>

  <!-- ── SENIAT label ── -->
  <rect x="242" y="346" width="50" height="8" rx="2" fill="#052210"/>
  <rect x="244" y="348" width="46" height="4" rx="1.5" fill="#22c55e" opacity="0.5"/>

  <!-- Corner accents -->
  <path d="M38 38 h45 v22" stroke="#15803d" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M762 38 h-45 v22" stroke="#15803d" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M38 462 h45 v-22" stroke="#15803d" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M762 462 h-45 v-22" stroke="#15803d" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>