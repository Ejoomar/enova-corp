<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#020c18"/><stop offset="100%" stop-color="#021e30"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Dot grid -->
  <g fill="#06b6d4" opacity="0.1">
    <circle cx="50" cy="50" r="1.5"/><circle cx="100" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/><circle cx="650" cy="50" r="1.5"/><circle cx="700" cy="50" r="1.5"/><circle cx="750" cy="50" r="1.5"/>
    <circle cx="50" cy="100" r="1.5"/><circle cx="750" cy="100" r="1.5"/>
    <circle cx="50" cy="450" r="1.5"/><circle cx="100" cy="450" r="1.5"/><circle cx="700" cy="450" r="1.5"/><circle cx="750" cy="450" r="1.5"/>
  </g>
  <!-- ── WiFi arcs above router ── -->
  <path d="M 280 192 Q 400 92 520 192" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.22"/>
  <path d="M 312 212 Q 400 130 488 212" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.38"/>
  <path d="M 344 232 Q 400 176 456 232" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 376 252 Q 400 230 424 252" stroke="#06b6d4" stroke-width="2.5" fill="none" opacity="0.9"/>
  <!-- WiFi center dot -->
  <circle cx="400" cy="268" r="5" fill="#06b6d4" opacity="0.95"/>
  <!-- ── Router body ── -->
  <rect x="200" y="280" width="400" height="90" rx="12" fill="#03111e" stroke="#0e7490" stroke-width="2.2"/>
  <!-- Top accent -->
  <rect x="200" y="280" width="400" height="3" rx="1.5" fill="#06b6d4" opacity="0.6"/>
  <!-- Router vents/slots -->
  <g stroke="#0e7490" stroke-width="1.2" opacity="0.5">
    <line x1="230" y1="296" x2="230" y2="340"/><line x1="242" y1="296" x2="242" y2="340"/>
    <line x1="254" y1="296" x2="254" y2="340"/><line x1="266" y1="296" x2="266" y2="340"/>
    <line x1="278" y1="296" x2="278" y2="340"/>
  </g>
  <!-- Brand strip -->
  <rect x="300" y="304" width="140" height="6" rx="3" fill="#06b6d4" opacity="0.25"/>
  <!-- Status LEDs -->
  <circle cx="364" cy="328" r="4" fill="#06b6d4" opacity="0.9"/>
  <circle cx="382" cy="328" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="400" cy="328" r="4" fill="#34d399" opacity="0.8"/>
  <circle cx="418" cy="328" r="4" fill="#06b6d4" opacity="0.4"/>
  <circle cx="436" cy="328" r="4" fill="#06b6d4" opacity="0.7"/>
  <!-- Port cluster -->
  <g fill="#03111e" stroke="#0e7490" stroke-width="1">
    <rect x="480" y="302" width="16" height="10" rx="1.5"/><rect x="500" y="302" width="16" height="10" rx="1.5"/>
    <rect x="520" y="302" width="16" height="10" rx="1.5"/><rect x="540" y="302" width="16" height="10" rx="1.5"/>
  </g>
  <!-- WAN port (different color) -->
  <rect x="462" y="302" width="14" height="10" rx="1.5" fill="#03111e" stroke="#06b6d4" stroke-width="1.2"/>
  <!-- Antennas -->
  <line x1="310" y1="280" x2="298" y2="220" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
  <line x1="490" y1="280" x2="502" y2="220" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
  <circle cx="298" cy="218" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="502" cy="218" r="4" fill="#06b6d4" opacity="0.6"/>
  <!-- ── Network topology nodes (background) ── -->
  <g opacity="0.2" stroke="#06b6d4" stroke-width="1" fill="none">
    <line x1="100" y1="380" x2="200" y2="370"/><line x1="200" y1="370" x2="400" y2="370"/>
    <line x1="600" y1="380" x2="400" y2="370"/><line x1="700" y1="380" x2="600" y2="380"/>
    <line x1="140" y1="430" x2="200" y2="370"/><line x1="660" y1="430" x2="600" y2="380"/>
  </g>
  <g fill="#06b6d4" opacity="0.25"><circle cx="100" cy="380" r="5"/><circle cx="140" cy="430" r="4"/><circle cx="600" cy="380" r="5"/><circle cx="660" cy="430" r="4"/><circle cx="700" cy="380" r="5"/></g>
  <!-- Corner accents -->
  <path d="M38 38 h45 v22" stroke="#0e7490" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M762 38 h-45 v22" stroke="#0e7490" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M38 462 h45 v-22" stroke="#0e7490" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M762 462 h-45 v-22" stroke="#0e7490" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>